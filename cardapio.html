<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <title>CARDÁPIO DIGITAL – B.B CHURRASCO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        .cats::-webkit-scrollbar { display: none; }
        transition-custom { transition: all 0.25s ease-in-out; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 dark:bg-[#0d0f12] dark:text-zinc-100 min-h-screen pb-36 transition-colors duration-300" id="corpo-pagina">

    <!-- Modal de Seleção de Mesa -->
    <div id="modal-mesa" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-zinc-900 w-full max-w-md rounded-3xl p-6 border border-zinc-200 dark:border-zinc-800 text-center shadow-2xl">
            <h1 class="text-2xl font-black text-red-600 mb-1">B.B CHURRASCO</h1>
            <p class="text-xs text-zinc-500 dark:text-zinc-400 mb-5">Selecione o número da sua mesa para ver o cardápio:</p>
            <div id="grid-mesas" class="grid grid-cols-5 gap-2 max-h-72 overflow-y-auto mb-2 p-1">
                <!-- Preenchido via JS -->
            </div>
        </div>
    </div>

    <!-- Modal: Histórico de Pedidos da Comanda -->
    <div id="modal-comanda" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-zinc-900 w-full max-w-md rounded-3xl p-6 border border-zinc-200 dark:border-zinc-800 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 class="text-lg font-black text-zinc-900 dark:text-white">Comanda da Mesa</h2>
                    <p id="sub-comanda-mesa" class="text-xs text-red-600 font-bold">Mesa --</p>
                </div>
                <button onclick="fecharComandaModal()" class="w-8 h-8 rounded-full bg-zinc-100 dark:bg-zinc-800 flex items-center justify-center text-zinc-500 font-bold">&times;</button>
            </div>
            <div id="lista-comanda-historico" class="space-y-2.5 max-h-72 overflow-y-auto mb-4 text-sm pr-1">
                <!-- Preenchido via JS -->
            </div>
            <div class="border-t border-zinc-200 dark:border-zinc-800 pt-3 flex justify-between items-center font-black text-base mb-4">
                <span class="text-zinc-500 dark:text-zinc-400 text-xs">Total Consumido:</span>
                <span id="comanda-total-geral" class="text-red-600 text-lg">R$ 0,00</span>
            </div>
            <button onclick="fecharComandaModal()" class="w-full bg-zinc-200 dark:bg-zinc-800 hover:bg-zinc-300 dark:hover:bg-zinc-700 text-zinc-800 dark:text-zinc-200 font-bold py-3 rounded-2xl text-sm transition-colors">Fechar</button>
        </div>
    </div>

    <!-- App Container -->
    <div id="app" class="max-w-md mx-auto p-4">
        
        <!-- Cabeçalho com Botão de Tema e Comanda -->
        <header class="bg-gradient-to-br from-red-600 to-red-700 p-5 rounded-3xl shadow-xl shadow-red-600/10 mb-4 text-white">
            <div class="flex justify-between items-start mb-3">
                <div>
                    <h1 class="text-xl font-black tracking-tight">B.B CHURRASCO</h1>
                    <p id="mesa-display" class="text-xs text-red-100 mt-0.5 font-medium">Mesa -- • Cardápio Digital</p>
                </div>
                <div class="flex items-center gap-1.5">
                    <!-- Botão Alternar Tema -->
                    <button onclick="alternarTema()" class="bg-black/20 hover:bg-black/30 w-9 h-9 rounded-2xl flex items-center justify-center backdrop-blur-md text-sm transition-transform active:scale-95" title="Mudar Tema">
                        <span id="icone-tema">☀️</span>
                    </button>
                    <!-- Botão Trocar Mesa -->
                    <button onclick="mudarMesa()" class="bg-black/20 hover:bg-black/30 text-xs px-3 h-9 rounded-2xl font-bold backdrop-blur-md transition-transform active:scale-95">Trocar Mesa</button>
                </div>
            </div>
            
            <!-- Botão para ver itens já confirmados na comanda -->
            <button onclick="abrirComandaModal()" class="w-full mt-1 bg-white/10 hover:bg-white/20 border border-white/10 text-white text-xs font-bold py-2.5 px-3 rounded-2xl flex items-center justify-center gap-2 backdrop-blur-sm transition-all">
                <span>📋 Ver Itens Já Pedidos/Confirmados</span>
            </button>
        </header>

        <!-- Campo Identificação do Cliente -->
        <div class="mb-4">
            <input type="text" id="nome-cliente" placeholder="Seu Nome / Apelido (Opcional)" class="w-full bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl p-3.5 text-zinc-900 dark:text-white placeholder-zinc-400 focus:outline-none focus:border-red-600 text-sm shadow-sm">
        </div>

        <!-- Categorias (Abas Horizontais) -->
        <div id="categorias-container" class="flex gap-2 overflow-x-auto pb-3 mb-2 cats scrollbar-none">
            <!-- Preenchido via JS -->
        </div>

        <!-- Lista de Produtos -->
        <div id="produtos-container" class="space-y-3">
            <!-- Preenchido via JS -->
        </div>
    </div>

    <!-- Barra Inferior do Carrinho Atual -->
    <div id="carrinho-bar" class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-zinc-950/95 border-t border-zinc-200 dark:border-zinc-800 p-4 backdrop-blur-md max-w-md mx-auto hidden z-40 shadow-2xl rounded-t-3xl">
        <div class="flex justify-between items-center mb-3">
            <span class="text-xs text-zinc-500 font-medium"><span id="total-itens" class="font-bold text-zinc-800 dark:text-zinc-200">0</span> itens selecionados</span>
            <span id="total-valor" class="text-base font-black text-red-600">R$ 0,00</span>
        </div>
        <button onclick="abrirResumo()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-red-600/30 text-sm transition-transform active:scale-95">Ver Pedido e Enviar</button>
    </div>

    <!-- Modal de Resumo do Pedido Atual -->
    <div id="modal-resumo" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-white dark:bg-zinc-900 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 border border-zinc-200 dark:border-zinc-800 shadow-2xl">
            <div class="flex justify-between items-center mb-3">
                <h2 id="modal-titulo" class="text-base font-black text-zinc-900 dark:text-white">Confirme seu Pedido</h2>
                <button onclick="fecharResumo()" class="w-8 h-8 rounded-full bg-zinc-100 dark:bg-zinc-800 flex items-center justify-center text-zinc-500 font-bold">&times;</button>
            </div>
            <p class="text-xs text-zinc-500 dark:text-zinc-400 mb-3">Após enviar, o pedido vai direto para a comanda da mesa.</p>
            <div id="lista-carrinho" class="space-y-2 max-h-56 overflow-y-auto mb-3 text-sm pr-1"></div>
            <div class="border-t border-zinc-200 dark:border-zinc-800 pt-3 flex justify-between font-bold text-base mb-4 text-zinc-900 dark:text-white">
                <span>Total deste envio</span>
                <span id="modal-total" class="text-red-600">R$ 0,00</span>
            </div>
            <button onclick="enviarPedidoFirebase()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-2xl mb-2 text-sm shadow-lg shadow-red-600/30 transition-transform active:scale-95">🚀 Enviar Pedido para a Cozinha</button>
            <button onclick="fecharResumo()" class="w-full bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-300 font-bold py-3 rounded-2xl text-sm transition-colors">Continuar escolhendo</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBP_3bvi9PnViCPkIQqEdoF1I7BcItfHEY",
            authDomain: "bbchurrasco-app.firebaseapp.com",
            projectId: "bbchurrasco-app",
            storageBucket: "bbchurrasco-app.firebasestorage.app",
            messagingSenderId: "470656170967",
            appId: "1:470656170967:web:f9c96614d411561ddfe992",
            measurementId: "G-C0KJ5GJKG2"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Cardápio completo com especificações corretas de embalagens e sem queijo no baião grande
        const cardapio = {
            "CHURRASCOS": [
                ["Frango", 8, "Suculento espeto de frango"],
                ["Porco", 8, "Espeto suíno temperado"],
                ["Linguiça", 8, "Linguiça artesanal na brasa"],
                ["Coração de frango", 8, "Corações selecionados"],
                ["Coração de boi", 8, "Coração bovino grelhado"],
                ["Carne", 8, "Espeto de carne bovina"],
                ["Tripa", 8, "Tripa crocante na brasa"]
            ],
            "CARANGUEJO": [
                ["Caranguejo Unidade", 8, "Unidade fresca ao leite de coco"],
                ["Combo 4 Caranguejos", 28, "Combo promocional com 4 unidades"],
                ["Caldo de Caranguejo", 5, "Caldo quentinho e temperado"]
            ],
            "BEBIDAS": [
                ["Skol", 5, "Lata 350ml"],
                ["Brahma Chopp", 5, "Lata 350ml"],
                ["Brahma Puro Malte", 5, "Lata 350ml"],
                ["Império", 9, "Lata 350ml"],
                ["Heineken", 9, "Long Neck 330ml"],
                ["Corona Extra", 10, "Long Neck 330ml"],
                ["Budweiser", 8, "Long Neck 330ml"],
                ["Vinho", 8, "Taça / Dose"],
                ["Caipirinha", 15, "Cachaça, limão e açúcar (Copo)"],
                ["Energético Red bull", 12, "Lata 250ml"],
                ["Kit gin", 80, "Gin rock’s / energético Baly / Gelo (Garrafa/Kit)"],
                ["Stella gold", 11, "Long Neck 330ml"],
                ["Ice cabaré", 9, "Long Neck 275ml"],
                ["Balde Skol", 50, "Balde com várias unidades"],
                ["Balde Brahma", 50, "Balde com várias unidades"],
                ["Terça amarela", 7, "Lata 350ml"],
                ["Terça prata", 6, "Lata 350ml"],
                ["Meio litro amarela", 16, "Garrafa 600ml"],
                ["Meio litro prata", 15, "Garrafa 600ml"],
                ["Litro da amarela", 35, "Garrafa 1 Litro"],
                ["Litro da prata", 30, "Garrafa 1 Litro"]
            ],
            "GUARNIÇÕES": [
                ["Baião caseiro grande", 8, "Porção grande tradicional"],
                ["Baião caseiro pequeno", 4, "Porção individual"],
                ["Baião cremoso grande", 10, "Com requeijão cremoso"],
                ["Baião cremoso pequeno", 5, "Individual cremoso"],
                ["Feijão verde", 25, "Combo especial"],
                ["Panelada", 18, "Acompanha arroz / farofa de cuscuz"]
            ],
            "PETISCOS": [
                ["Batata frita", 15, "Porção crocante"],
                ["Calabresa acebolada", 15, "Com cebolas douradas"],
                ["Camarão (porção)", 25, "Camarões selecionados"],
                ["Bolinha carne do sol", 18, "Porção recheada"],
                ["Bolinha de queijo", 15, "Crocante e derretida"]
            ],
            "REFRIGERANTES": [
                ["Coca-Cola 1L", 8, "Garrafa 1 Litro"],
                ["Guaraná 1L", 7, "Garrafa 1 Litro"],
                ["Pepsi 1L", 7, "Garrafa 1 Litro"],
                ["Coca-Cola lata", 5, "Lata 350ml"],
                ["Fanta lata", 5, "Lata 350ml"],
                ["Sprite lata", 6, "Lata 350ml"],
                ["Água", 3, "Garrafa 500ml sem gás"],
                ["Água com gás", 4, "Garrafa 500ml com gás"]
            ],
            "SUCOS": [
                ["Suco Maracujá 400ml", 8, "Fruta natural da polpa"],
                ["Suco Manga 400ml", 7, "Refrescante e cremoso"],
                ["Suco Goiaba 400ml", 7, "Sabor natural"]
            ],
            "DIVERSOS": [
                ["Cigarro", 7, "Carteira"],
                ["Partilha halls", 3, "Unidade de pastilha"]
            ]
        };

        let mesaAtual = null;
        let categoriaAtiva = "CHURRASCOS";
        let carrinho = [];

        // Gerenciamento de Tema (Claro / Escuro)
        function alternarTema() {
            const html = document.documentElement;
            const icone = document.getElementById('icone-tema');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('bb_tema', 'light');
                icone.innerText = '🌙';
            } else {
                html.classList.add('dark');
                localStorage.setItem('bb_tema', 'dark');
                icone.innerText = '☀️';
            }
        }

        function carregarTemaSalvo() {
            const salvo = localStorage.getItem('bb_tema') || 'dark';
            const html = document.documentElement;
            const icone = document.getElementById('icone-tema');
            if (salvo === 'light') {
                html.classList.remove('dark');
                icone.innerText = '🌙';
            } else {
                html.classList.add('dark');
                icone.innerText = '☀️';
            }
        }

        // Inicialização das Mesas
        function iniciarGridMesas() {
            const grid = document.getElementById('grid-mesas');
            grid.innerHTML = '';
            for (let i = 1; i <= 30; i++) {
                grid.innerHTML += `<button onclick="selecionarMesa(${i})" class="bg-zinc-100 dark:bg-zinc-800 hover:bg-red-600 hover:text-white dark:hover:bg-red-600 text-zinc-800 dark:text-zinc-200 font-bold py-3 rounded-2xl text-sm border border-zinc-200 dark:border-zinc-700/50 transition-all">${i}</button>`;
            }
        }

        function verificarMesaInicial() {
            const urlParams = new URLSearchParams(window.location.search);
            const mesaUrl = urlParams.get('mesa');
            if (mesaUrl && mesaUrl >= 1 && mesaUrl <= 30) {
                selecionarMesa(mesaUrl);
            } else {
                iniciarGridMesas();
            }
        }

        function selecionarMesa(num) {
            mesaAtual = num;
            document.getElementById('mesa-display').innerText = `Mesa ${mesaAtual} • Cardápio Digital`;
            document.getElementById('modal-mesa').classList.add('hidden');
        }

        function mudarMesa() {
            document.getElementById('modal-mesa').classList.remove('hidden');
            iniciarGridMesas();
        }

        // Histórico da Comanda no Firebase
        async function abrirComandaModal() {
            if (!mesaAtual) return;
            document.getElementById('sub-comanda-mesa').innerText = `Mesa ${mesaAtual}`;
            const listaEl = document.getElementById('lista-comanda-historico');
            listaEl.innerHTML = `<p class="text-xs text-center text-zinc-400 py-4">Carregando comanda...</p>`;
            document.getElementById('modal-comanda').classList.remove('hidden');

            try {
                const comandaRef = db.collection('comandas').doc(String(mesaAtual));
                const doc = await comandaRef.get();

                if (!doc.exists || !doc.data().itens || doc.data().itens.length === 0) {
                    listaEl.innerHTML = `<p class="text-xs text-center text-zinc-400 py-4">Nenhum item confirmado na comanda ainda.</p>`;
                    document.getElementById('comanda-total-geral').innerText = `R$ 0,00`;
                    return;
                }

                const dados = doc.data();
                const itens = dados.itens;
                let totalGeral = 0;

                listaEl.innerHTML = itens.map(i => {
                    const subtotal = (i.preco || 0) * (i.qtd || 0);
                    totalGeral += subtotal;
                    const clienteTag = i.cliente ? `<span class="text-[10px] bg-red-500/10 text-red-500 px-1.5 py-0.5 rounded-md ml-1 font-semibold">${i.cliente}</span>` : '';
                    return `
                        <div class="flex justify-between items-center py-2 border-b border-zinc-100 dark:border-zinc-800 text-xs">
                            <div>
                                <span class="font-bold text-zinc-800 dark:text-zinc-200">${i.qtd}x ${i.nome}</span>
                                ${clienteTag}
                            </div>
                            <span class="font-black text-zinc-900 dark:text-white">R$ ${subtotal.toFixed(2).replace('.', ',')}</span>
                        </div>
                    `;
                }).join('');

                document.getElementById('comanda-total-geral').innerText = `R$ ${totalGeral.toFixed(2).replace('.', ',')}`;
            } catch (err) {
                listaEl.innerHTML = `<p class="text-xs text-center text-red-500 py-4">Erro ao carregar comanda.</p>`;
            }
        }

        function fecharComandaModal() {
            document.getElementById('modal-comanda').classList.add('hidden');
        }

        function renderizarCategorias() {
            const container = document.getElementById('categorias-container');
            container.innerHTML = Object.keys(cardapio).map(cat => `
                <button onclick="mudarCategoria('${cat}')" class="whitespace-nowrap px-4 py-2.5 rounded-2xl font-bold text-xs border transition-all ${cat === categoriaAtiva ? 'bg-red-600 text-white border-red-600 shadow-md shadow-red-600/20' : 'bg-white dark:bg-zinc-900 text-zinc-500 dark:text-zinc-400 border-zinc-200 dark:border-zinc-800 hover:border-zinc-300 dark:hover:border-zinc-700'}">${cat}</button>
            `).join('');
        }

        function mudarCategoria(cat) {
            categoriaAtiva = cat;
            renderizarCategorias();
            renderizarProdutos();
        }

        function renderizarProdutos() {
            const container = document.getElementById('produtos-container');
            const itens = cardapio[categoriaAtiva] || [];

            container.innerHTML = itens.map(([nome, preco, desc]) => {
                const itemCarrinho = carrinho.find(i => i.nome === nome);
                const qtd = itemCarrinho ? itemCarrinho.qtd : 0;

                return `
                    <div class="bg-white dark:bg-zinc-900/80 border border-zinc-200/80 dark:border-zinc-800/80 p-4 rounded-3xl flex justify-between items-center shadow-sm">
                        <div class="pr-2">
                            <h3 class="font-bold text-zinc-900 dark:text-white text-sm">${nome}</h3>
                            <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5 leading-relaxed">${desc}</p>
                            <span class="text-red-600 font-black text-sm mt-1.5 block">R$ ${preco.toFixed(2).replace('.', ',')}</span>
                        </div>
                        <div class="flex items-center gap-2 bg-zinc-100 dark:bg-black/40 p-1.5 rounded-2xl border border-zinc-200 dark:border-zinc-800 shrink-0">
                            <button onclick="alterarQtd('${nome.replace(/'/g, "\\'")}', ${preco}, -1)" class="w-8 h-8 rounded-xl bg-white dark:bg-zinc-800 text-zinc-700 dark:text-zinc-200 font-bold flex items-center justify-center shadow-sm active:scale-90 transition-transform">-</button>
                            <span id="qtd-${nome}" class="w-6 text-center font-bold text-sm text-zinc-900 dark:text-white">${qtd}</span>
                            <button onclick="alterarQtd('${nome.replace(/'/g, "\\'")}', ${preco}, 1)" class="w-8 h-8 rounded-xl bg-red-600 text-white font-bold flex items-center justify-center shadow-md shadow-red-600/30 active:scale-90 transition-transform">+</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function alterarQtd(nome, preco, delta) {
            let item = carrinho.find(i => i.nome === nome);
            if (item) {
                item.qtd += delta;
                if (item.qtd <= 0) {
                    carrinho = carrinho.filter(i => i.nome !== nome);
                }
            } else if (delta > 0) {
                carrinho.push({ nome, preco, qtd: delta });
            }

            const elemQtd = document.getElementById(`qtd-${nome}`);
            if (elemQtd) {
                const atualizado = carrinho.find(i => i.nome === nome);
                elemQtd.innerText = atualizado ? atualizado.qtd : 0;
            }

            atualizarBarraCarrinho();
        }

        function atualizarBarraCarrinho() {
            const totalQtd = carrinho.reduce((sum, i) => sum + i.qtd, 0);
            const totalVal = carrinho.reduce((sum, i) => sum + (i.preco * i.qtd), 0);

            document.getElementById('total-itens').innerText = totalQtd;
            document.getElementById('total-valor').innerText = `R$ ${totalVal.toFixed(2).replace('.', ',')}`;

            const bar = document.getElementById('carrinho-bar');
            if (totalQtd > 0) {
                bar.classList.remove('hidden');
            } else {
                bar.classList.add('hidden');
            }
        }

        function abrirResumo() {
            const lista = document.getElementById('lista-carrinho');
            lista.innerHTML = '';
            let total = 0;

            carrinho.forEach(item => {
                const sub = item.preco * item.qtd;
                total += sub;
                lista.innerHTML += `
                    <div class="flex justify-between items-center py-2 border-b border-zinc-100 dark:border-zinc-800 text-xs">
                        <span class="text-zinc-700 dark:text-zinc-300 font-medium">${item.qtd}x ${item.nome}</span>
                        <span class="font-bold text-zinc-900 dark:text-white">R$ ${sub.toFixed(2).replace('.', ',')}</span>
                    </div>
                `;
            });

            document.getElementById('modal-titulo').innerText = `Mesa ${mesaAtual} — Seu Pedido`;
            document.getElementById('modal-total').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
            document.getElementById('modal-resumo').classList.remove('hidden');
        }

        function fecharResumo() {
            document.getElementById('modal-resumo').classList.add('hidden');
        }

        async function enviarPedidoFirebase() {
            const cliente = document.getElementById('nome-cliente').value.trim() || "Cliente Anônimo";
            if (!carrinho.length || !mesaAtual) return;

            try {
                const comandaRef = db.collection('comandas').doc(String(mesaAtual));
                const doc = await comandaRef.get();
                
                let itensExistentes = [];
                let totalExistente = 0;
                let garcomAtual = "Hebster";
                let criadoEmOriginal = Date.now();

                if (doc.exists) {
                    const dados = doc.data();
                    itensExistentes = dados.itens || [];
                    totalExistente = dados.total || 0;
                    garcomAtual = dados.garcom || "Hebster";
                    criadoEmOriginal = dados.criadoEm || Date.now();
                }

                const novosItensFormatados = carrinho.map(i => ({
                    cliente: cliente,
                    nome: i.nome,
                    qtd: i.qtd,
                    preco: i.preco
                }));

                const itensCombinados = [...itensExistentes, ...novosItensFormatados];
                const valorAdicional = carrinho.reduce((sum, i) => sum + (i.preco * i.qtd), 0);
                const novoTotal = totalExistente + valorAdicional;

                await comandaRef.set({
                    garcom: garcomAtual,
                    itens: itensCombinados,
                    total: novoTotal,
                    criadoEm: criadoEmOriginal,
                    atualizadoEm: Date.now()
                }, { merge: true });

                alert('Pedido enviado com sucesso para a comanda da mesa!');
                
                carrinho = [];
                renderizarProdutos();
                atualizarBarraCarrinho();
                fecharResumo();
            } catch (error) {
                alert('Erro ao enviar pedido: ' + error.message);
            }
        }

        // Inicialização inicial
        carregarTemaSalvo();
        verificarMesaInicial();
        renderizarCategorias();
        renderizarProdutos();
    </script>
</body>
</html>
