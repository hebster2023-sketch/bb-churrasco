<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>CARDÁPIO DIGITAL — B.B CHURRASCO</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --brand: #ef4444;
  --brand-hover: #dc2626;
  --ink: #f3f4f6;
  --bg: #0d0f12;
  --card: rgba(30, 32, 38, 0.75);
  --border: rgba(255, 255, 255, 0.08);
  --muted: #9ca3af;
  --input-bg: rgba(20, 22, 27, 0.8);
}
[data-theme="light"] {
  --brand: #b12f29;
  --brand-hover: #8f241f;
  --ink: #14281e;
  --bg: #f4f7f5;
  --card: rgba(255, 255, 255, 0.85);
  --border: rgba(0, 0, 0, 0.08);
  --muted: #6c7a72;
  --input-bg: rgba(248, 250, 249, 0.9);
}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
body{padding-bottom:140px}.app{max-width:760px;margin:auto;padding:16px 16px 140px}

/* Header */
.header{background:linear-gradient(135deg,var(--brand),var(--brand-hover));color:#fff;border-radius:24px;padding:20px 18px;box-shadow:0 12px 30px rgba(239, 68, 68, 0.25);position:relative;overflow:hidden;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:22px;font-weight:900;letter-spacing:-.5px;margin:0}.header p{margin:4px 0 0;font-size:11px;opacity:.9}
.theme-btn{background:rgba(255,255,255,.2);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:16px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);transition:transform .2s cubic-bezier(0.34, 1.56, 0.64, 1)}
.theme-btn:active{transform:scale(.85)}

/* Toast Flutuante */
#toast-container{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:min(90%, 400px);pointer-events:none}
.toast{background:rgba(31, 41, 55, 0.95);backdrop-filter:blur(8px);color:#fff;padding:12px 16px;border-radius:14px;font-size:12px;font-weight:800;box-shadow:0 10px 25px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px;pointer-events:auto;animation: fadeInOut .3s cubic-bezier(0.34, 1.56, 0.64, 1)}
[data-theme="light"] .toast{background:rgba(20, 40, 30, 0.95);color:#fff}
@keyframes fadeInOut { from{opacity:0;transform:translateY(-15px) scale(0.95)} to{opacity:1;transform:translateY(0) scale(1)} }

/* Cards Genéricos */
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.05);padding:16px;margin-bottom:12px}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:20px 2px 10px}.section-title h2{font-size:18px;font-weight:900;color:var(--ink);margin:0}.muted{color:var(--muted);font-size:12px}

/* Busca de Produtos */
.search-box{position:relative;margin-bottom:12px}
.search-box input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--border);background:var(--input-bg);backdrop-filter:blur(10px);color:var(--ink);border-radius:14px;font-size:12px;font-weight:700;outline:none;transition:all .2s}
.search-box input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(239,68,68,0.15)}
.search-box span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px}

/* Categorias */
.cats{display:flex;gap:8px;overflow:auto;padding:2px 2px 10px;scrollbar-width:none;position:sticky;top:0;z-index:20;background:var(--bg)}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;border:1px solid var(--border);background:var(--card);backdrop-filter:blur(10px);color:var(--muted);border-radius:999px;padding:8px 14px;font-weight:800;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.02);cursor:pointer;transition:all .2s cubic-bezier(0.34, 1.56, 0.64, 1)}
.cat.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 14px rgba(239,68,68,0.3);transform:translateY(-1px)}
.cat:active{transform:scale(0.92)}

/* Cards de Produtos */
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.product{overflow:hidden;border-radius:18px;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.03);transition:all .2s;position:relative}
.product.selected{border-color:var(--brand);box-shadow:0 6px 20px rgba(239,68,68,0.15)}
.product.selected::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand);border-radius:4px 0 0 4px}

.prod-img{height:75px;width:100%;display:flex;align-items:center;justify-content:center;background:var(--input-bg)}
.prod-body{padding:10px 10px 10px 12px}
.prod-name{font-size:13px;font-weight:900;line-height:1.2;min-height:32px;color:var(--ink)}
.prod-desc{font-size:10px;color:var(--muted);margin-top:2px;font-weight:600}
.price{font-size:13px;font-weight:900;color:var(--brand);margin:4px 0 8px}
.qty{display:flex;align-items:center;justify-content:space-between;gap:4px}
.qty button{width:32px;height:32px;border:0;border-radius:10px;background:var(--input-bg);color:var(--ink);font-weight:900;font-size:16px;cursor:pointer;transition:transform .15s cubic-bezier(0.34, 1.56, 0.64, 1)}
.qty button:active{transform:scale(0.8)}
.qty button.plus{background:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(239,68,68,0.3)}
.qty span{font-weight:900;min-width:20px;text-align:center;font-size:14px;color:var(--ink)}

/* Barra Flutuante de Carrinho */
.cartbar{position:fixed;z-index:90;left:50%;transform:translateX(-50%) translateY(100px);bottom:20px;width:min(700px,calc(100% - 24px));background:rgba(30, 41, 59, 0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;border-radius:20px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 15px 35px rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.1);transition:transform .4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity .3s ease;opacity:0}
.cartbar.show-cart{transform:translateX(-50%) translateY(0);opacity:1}
[data-theme="light"] .cartbar{background:rgba(20, 40, 30, 0.95)}
.cartbar button{border:0;background:#fff;color:#14281e;border-radius:12px;padding:8px 14px;font-weight:900;cursor:pointer;font-size:13px;transition:transform .2s}
.cartbar button:active{transform:scale(0.92)}

/* Modais */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:none;align-items:end}
.modal.show{display:flex}
.sheet{background:var(--card);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);color:var(--ink);width:100%;max-width:760px;margin:auto auto 0;border-radius:28px 28px 0 0;padding:20px;max-height:86vh;overflow:auto;box-shadow:0 -15px 50px rgba(0,0,0,0.4);border-top:1px solid var(--border);animation: slideUpModal .3s cubic-bezier(0.34, 1.56, 0.64, 1)}
@keyframes slideUpModal { from{transform:translateY(100%)} to{transform:translateY(0)} }

.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet h2{font-size:18px;font-weight:900;color:var(--ink);margin:0}
.close{border:0;background:var(--input-bg);color:var(--ink);border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.line small{color:var(--muted)}
.totalrow{display:flex;justify-content:space-between;font-size:17px;font-weight:900;padding:14px 0;border-top:2px dashed var(--border);margin-top:4px}
.primary{width:100%;border:0;background:var(--brand);color:#fff;border-radius:14px;padding:14px;font-weight:900;font-size:14px;box-shadow:0 6px 18px rgba(239, 68, 68, 0.3);cursor:pointer}
.secondary{width:100%;border:0;background:var(--input-bg);color:var(--ink);border:1px solid var(--border);border-radius:14px;padding:12px;font-weight:900;margin-top:6px;cursor:pointer;font-size:13px}
</style>
</head>
<body>

<div id="toast-container"></div>

<!-- MODAL DE IDENTIFICAÇÃO DA MESA (Caso o cliente abra sem ?mesa=X no link) -->
<div id="modal-mesa" style="position:fixed;inset:0;background:radial-gradient(circle at center, #1e2028 0%, #0d0f12 100%);z-index:999;display:none;align-items:center;justify-content:center;padding:16px">
  <div style="background:var(--card);backdrop-filter:blur(25px);border:1px solid var(--border);border-radius:24px;padding:26px;width:100%;max-width:360px;box-shadow:0 25px 50px rgba(0,0,0,.5);text-align:center">
    <div style="font-size:32px;margin-bottom:6px">🪑</div>
    <h2 style="font-size:20px;font-weight:900;margin:0;color:var(--ink)">B.B CHURRASCO</h2>
    <p style="font-size:12px;color:var(--muted);margin:6px 0 16px">Digite o número da sua mesa para ver o cardápio:</p>
    <input type="number" id="input-mesa-cliente" min="1" max="30" placeholder="Ex: 5" style="width:100%;padding:12px;border:1px solid var(--border);background:var(--input-bg);color:var(--ink);border-radius:12px;font-size:16px;font-weight:900;text-align:center;outline:none;margin-bottom:12px">
    <button onclick="salvarMesaCliente()" style="width:100%;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 6px 18px rgba(239,68,68,0.3)">Acessar Cardápio</button>
  </div>
</div>

<div class="app">
  <header class="header">
    <div>
      <h1>B.B CHURRASCO</h1>
      <p id="label-mesa-topo">Mesa -- • Cardápio Digital</p>
    </div>
    <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Alternar Tema">☀️</button>
  </header>

  <div class="card" style="padding:12px">
    <div style="font-weight:900;margin-bottom:6px;font-size:12px;display:flex;justify-content:space-between;align-items:center">
      <span>👤 Seu Nome / Apelido:</span>
    </div>
    <input type="text" id="input-nome-cliente" value="Cliente 1" oninput="clienteAtual = this.value.trim() || 'Cliente 1'" style="width:100%;padding:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--ink);border-radius:10px;font-size:13px;font-weight:700;outline:none">
  </div>

  <div class="search-box">
    <span>🔍</span>
    <input type="text" placeholder="Pesquisar produto instantaneamente (ex: skol, frango)..." value="" oninput="filtrarProdutosInput(this.value)">
  </div>

  <div class="section-title"><h2>Cardápio</h2><span class="muted" id="total-itens-badge">0 itens</span></div>
  <div class="cats" id="cats-container"></div>
  <div id="produtos" class="products"></div>
</div>

<div id="cartBar" class="cartbar">
  <div><strong id="cartCount" style="font-size:13px">0 itens</strong><br><span id="cartTotal" style="font-size:12px;opacity:.9">R$ 0,00</span></div>
  <button onclick="abrirCarrinho()">Ver meu pedido →</button>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)fecharModal()">
 <div class="sheet">
  <div class="sheet-head"><h2 id="modalTitle">Seu Pedido</h2><button class="close" onclick="fecharModal()">×</button></div>
  <div id="modalBody"></div>
 </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBP_3bvi9PnViCPkIQqEdoF1I7BcItfHEY",
  authDomain: "bbchurrasco-app.firebaseapp.com",
  projectId: "bbchurrasco-app",
  storageBucket: "bbchurrasco-app.firebasestorage.app",
  messagingSenderId: "470656170967",
  appId: "1:470656170967:web:f9c96614d411561ddfe992",
  measurementId: "G-C0KJ5GJKG2"
};
if(!firebase.apps.length){firebase.initializeApp(firebaseConfig);}
const db = firebase.firestore();

// Variáveis do Cliente
let numeroMesa = null;
let clienteAtual = "Cliente 1";
let pedidoTemp = {};
let categoriaAtual = "CHURRASCOS";
let termoBuscaProduto = "";
let comandaAtualServidor = { itens: [], total: 0, itensPagos: [], garcom: "Hebster" };

const br = v => (v || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pad = n => String(n).padStart(2,"0");

// Pegar mesa via URL (Ex: cardapio.html?mesa=5) ou localStorage
window.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  let mesaParam = urlParams.get('mesa');
  
  if(mesaParam && !isNaN(mesaParam)){
    numeroMesa = parseInt(mesaParam);
    localStorage.setItem('bb_mesa_cliente', numeroMesa);
  } else {
    let salva = localStorage.getItem('bb_mesa_cliente');
    if(salva && !isNaN(salva)){
      numeroMesa = parseInt(salva);
    } else {
      document.getElementById('modal-mesa').style.display = 'flex';
    }
  }
  
  if(numeroMesa){
    iniciarAppCliente();
  }
});

function salvarMesaCliente(){
  let val = parseInt(document.getElementById('input-mesa-cliente').value);
  if(!val || val < 1 || val > 30){
    alert("Por favor, digite um número de mesa válido entre 1 e 30.");
    return;
  }
  numeroMesa = val;
  localStorage.setItem('bb_mesa_cliente', numeroMesa);
  document.getElementById('modal-mesa').style.display = 'none';
  iniciarAppCliente();
}

function iniciarAppCliente(){
  document.getElementById('label-mesa-topo').textContent = `Mesa ${pad(numeroMesa)} • Cardápio Digital`;
  
  // Ouve atualizações em tempo real da mesa no Firestore
  db.collection("comandas").doc(String(numeroMesa)).onSnapshot(doc => {
    if(doc.exists){
      comandaAtualServidor = doc.data();
    } else {
      comandaAtualServidor = { itens: [], total: 0, itensPagos: [], garcom: "Hebster" };
    }
  });

  renderCategorias();
  renderProdutos();
}

// Tema Claro/Escuro
function toggleTheme(){
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  document.getElementById('themeToggleBtn').textContent = next === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('bb_theme', next);
}
const savedTheme = localStorage.getItem('bb_theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);

function showToast(msg, isError = false){
  const container = document.getElementById('toast-container');
  if(!container) return;
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.borderLeft = isError ? '4px solid #ef4444' : '4px solid #10b981';
  t.innerHTML = `<span>${isError ? '⚠️' : '✅'}</span> <span>${msg}</span>`;
  container.appendChild(t);
  setTimeout(() => { t.remove(); }, 2500);
}

// Ícones e Cardápio
const iconeGenerico = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="12" y1="7" x2="12.01" y2="7"/></svg>`;
const iconeCarne = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 5.5a3 3 0 1 0 4 4L12 17l-5.5-5.5a3 3 0 1 0 4-4L12 8l3.5-2.5z"/></svg>`;
const iconeBebida = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 11h1a3 3 0 0 1 0 6h-1"/><path d="M9 12v6"/><path d="M13 12v6"/><path d="M14 7.5c-1 0-2-.5-2-1.5s-1-1.5-2-1.5-2 .5-2 1.5"/><path d="M5 7h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/></svg>`;
const iconePetisco = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M6 15l2-10h8l2 10"/><path d="M10 15v4"/><path d="M14 15v4"/></svg>`;

const cardapio={
"CHURRASCOS":[
["Frango", 8, iconeCarne],
["Porco", 8, iconeCarne],
["Linguiça", 8, iconeCarne],
["Coração de frango", 8, iconeCarne],
["Coração de boi", 8, iconeCarne],
["Carne", 8, iconeCarne],
["Tripa", 8, iconeCarne]],
"CARANGUEJO":[
["Caranguejo Unidade", 8, iconePetisco],
["Combo 4 Caranguejos", 28, iconePetisco],
["Caldo de Caranguejo", 5, iconePetisco]],
"BEBIDAS":[
["Skol", 5, iconeBebida],
["Brahma Chopp", 5, iconeBebida],
["Brahma Puro Malte", 5, iconeBebida],
["Império", 9, iconeBebida],
["Heineken", 9, iconeBebida],
["Corona Extra", 10, iconeBebida],
["Budweiser", 8, iconeBebida],
["Vinho", 7, iconeBebida],
["Caipirinha", 15, iconeBebida],
["Energético Red bull", 10, iconeBebida, "Lata"],
["Kit gin", 80, iconeBebida, "Gin rock’s / energético Baly / Gelo"],
["Stella gold", 11, iconeBebida],
["Ice cabaré", 9, iconeBebida],
["Balde Skol", 50, iconeBebida],
["Balde Brahma", 50, iconeBebida],
["Terça amarela", 7, iconeBebida],
["Terça prata", 6, iconeBebida],
["Meio litro amarela", 16, iconeBebida],
["Meio litro prata", 15, iconeBebida],
["Litro da amarela", 35, iconeBebida],
["Litro da prata", 30, iconeBebida]],
"GUARNIÇÕES":[
["Baião caseiro grande", 8, iconeGenerico],
["Baião caseiro pequeno", 4, iconeGenerico],
["Baião cremoso grande", 10, iconeGenerico],
["Baião cremoso pequeno", 5, iconeGenerico],
["Feijão verde", 25, iconeGenerico, "Combo"],
["Panelada", 18, iconeGenerico, "Arroz / farofa de cuscuz"]],
"PETISCOS":[
["Batata frita", 15, iconePetisco],
["Calabresa acebolada", 15, iconePetisco],
["Camarão (porção)", 25, iconePetisco],
["Bolinha carne do sol", 18, iconePetisco],
["Bolinha de queijo", 15, iconePetisco]],
"REFRIGERANTES":[
["Coca-Cola 1L", 8, iconeBebida],
["Guaraná 1L", 7, iconeBebida],
["Pepsi 1L", 7, iconeBebida],
["Coca-Cola lata", 5, iconeBebida],
["Fanta lata", 5, iconeBebida],
["Sprite lata", 6, iconeBebida],
["Água", 3, iconeBebida],
["Água com gás", 4, iconeBebida]],
"SUCOS":[
["Suco Maracujá 400ml", 8, iconeBebida],
["Suco Manga 400ml", 7, iconeBebida],
["Suco Goiaba 400ml", 7, iconeBebida]],
"DIVERSOS":[
["Cigarro", 7, iconeGenerico, "Carteira"],
["Partilha halls", 3, iconeGenerico]]
};

function produtosFlat(){ let a = []; for(const cat in cardapio) cardapio[cat].forEach(p => a.push({nome:p[0], preco:p[1], svg:p[2], desc:p[3], cat})); return a; }

function alterarQtd(nome, delta){ 
  if(!pedidoTemp[clienteAtual]) pedidoTemp[clienteAtual] = {};
  pedidoTemp[clienteAtual][nome] = (pedidoTemp[clienteAtual][nome] || 0) + delta; 
  if(pedidoTemp[clienteAtual][nome] < 0) pedidoTemp[clienteAtual][nome] = 0; 
  renderProdutos(); 
  atualizarBar(); 
}

function itensTempComClientes(){
  let arr = [];
  for(const cli in pedidoTemp){
    for(const prod in pedidoTemp[cli]){
      let qtd = pedidoTemp[cli][prod];
      if(qtd > 0){
        let pObj = produtosFlat().find(p => p.nome === prod);
        let preco = pObj ? pObj.preco : 0;
        arr.push({ cliente: cli, nome: prod, qtd: qtd, preco: preco });
      }
    }
  }
  return arr;
}

function totalTemp(){ 
  return itensTempComClientes().reduce((s,i) => s + i.qtd * i.preco, 0);
}

function atualizarBar(){
  const itensArr = itensTempComClientes();
  const total = totalTemp();
  const totalItens = itensArr.reduce((a,b) => a+b.qtd, 0);
  const bar = document.getElementById("cartBar");
  
  document.getElementById("total-itens-badge").textContent = `${totalItens} ${totalItens === 1 ? "item selecionado" : "itens selecionados"}`;

  if(totalItens > 0){
    bar.classList.add("show-cart");
    document.getElementById("cartCount").textContent = `${totalItens} ${totalItens === 1 ? "item" : "itens"}`;
    document.getElementById("cartTotal").textContent = br(total);
  } else {
    bar.classList.remove("show-cart");
  }
}

function setCategoria(cat){ 
  categoriaAtual = cat; 
  renderCategorias();
  renderProdutos(); 
}

function filtrarProdutosInput(val){ 
  termoBuscaProduto = val.toLowerCase().trim(); 
  renderProdutos(); 
}

function renderCategorias(){
  const el = document.getElementById("cats-container");
  if(!el) return;
  el.innerHTML = Object.keys(cardapio).map(c => `
    <button class="cat ${c === categoriaAtual ? "active" : ""}" onclick="setCategoria('${c}')">
      ${c==="CHURRASCOS"?"🔥":c==="CARANGUEJO"?"🦀":c==="BEBIDAS"?"🍺":c==="GUARNIÇÕES"?"🍚":c==="PETISCOS"?"🍟":c==="REFRIGERANTES"?"🥤":c==="SUCOS"?"🧃":"🛒"} ${c}
    </button>`).join("");
}

function renderProdutos(){
 const el = document.getElementById("produtos"); if(!el) return;
 let cliMap = pedidoTemp[clienteAtual] || {};
 let listaProd = cardapio[categoriaAtual];
 
 if(termoBuscaProduto){
   listaProd = produtosFlat().filter(p => p.nome.toLowerCase().includes(termoBuscaProduto));
 }

 el.innerHTML = listaProd.map(p => {
   const [nome, preco, svg, desc] = p, q = cliMap[nome] || 0;
   return `<div class="product ${q ? "selected" : ""}">
   <div class="prod-img">${svg}</div><div class="prod-body"><div class="prod-name">${nome}</div>${desc ? `<div class="prod-desc">${desc}</div>` : ''}<div class="price">${br(preco)}</div>
   <div class="qty"><button onclick="alterarQtd('${nome.replace(/'/g,"\\'")}',-1)">−</button><span>${q}</span><button class="plus" onclick="alterarQtd('${nome.replace(/'/g,"\\'")}',1)">+</button></div></div></div>`;
 }).join("");
 atualizarBar();
}

function abrirCarrinho(){
 const itens = itensTempComClientes();
 if(!itens.length){ showToast("Seu pedido está vazio.", true); return; }

 document.getElementById("modalTitle").textContent = `Mesa ${pad(numeroMesa)} — Seu Pedido`;
 document.getElementById("modalBody").innerHTML = `
  <div style="font-size:11px;color:var(--muted);margin-bottom:10px">Confira os itens que você deseja enviar para a cozinha:</div>
  ${itens.map(i => `<div class="line"><div><b>[${i.cliente}]</b> ${i.qtd}x ${i.nome}<br><small>${br(i.preco)} cada</small></div><strong>${br(i.qtd*i.preco)}</strong></div>`).join("")}
  <div class="totalrow"><span>Total do Pedido</span><span>${br(totalTemp())}</span></div>
  <button class="primary" onclick="enviarPedidoParaCozinha()">🚀 Enviar Pedido para a Cozinha</button>
  <button class="secondary" onclick="fecharModal()">Continuar escolhendo</button>`;
 document.getElementById("modal").classList.add("show");
}

function fecharModal(){ document.getElementById("modal").classList.remove("show"); }

function enviarPedidoParaCozinha(){
  const novosItens = itensTempComClientes();
  if(!novosItens.length) return;

  // Junta com os itens que já estavam na comanda do servidor (se houver)
  const itensAntigos = comandaAtualServidor.itens || [];
  const itensCombinados = [...itensAntigos, ...novosItens];
  const valorTotalAntigo = comandaAtualServidor.total || 0;
  const valorTotalNovo = valorTotalAntigo + totalTemp();
  const garcomAtivo = comandaAtualServidor.garcom || "Hebster";
  const criadoEmOriginal = comandaAtualServidor.criadoEm || Date.now();

  const dadosComanda = {
    garcom: garcomAtivo,
    itens: itensCombinados,
    itensPagos: comandaAtualServidor.itensPagos || [],
    total: valorTotalNovo,
    criadoEm: criadoEmOriginal,
    atualizadoEm: Date.now()
  };

  db.collection("comandas").doc(String(numeroMesa)).set(dadosComanda, { merge: true })
    .then(() => {
      pedidoTemp = {}; // Limpa carrinho local
      fecharModal();
      showToast("Pedido enviado com sucesso! O garçom já foi avisado.");
      renderProdutos();
    })
    .catch(err => {
      showToast("Erro ao enviar pedido: " + err.message, true);
    });
}
</script>
