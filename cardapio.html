<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <title>CARDÁPIO DIGITAL – B.B CHURRASCO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --brand: #ef4444;
            --brand-hover: #dc2626;
            --ink: #f3f4f6;
            --bg: #0d0f12;
            --card: rgba(30, 32, 38, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --muted: #9ca3af;
            --input-bg: rgba(20, 22, 27, 0.8);
        }
        body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, sans-serif; padding-bottom: 140px; }
        .cats::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen">
    <!-- Seletor de 30 Mesas (Modal Inicial caso não haja mesa na URL) -->
    <div id="modal-mesa" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
        <div class="bg-zinc-900 w-full max-w-md rounded-3xl p-6 border border-white/10 text-center">
            <h1 class="text-2xl font-black text-red-500 mb-2">B.B CHURRASCO</h1>
            <p class="text-sm text-gray-300 mb-6">Selecione o número da sua mesa para ver o cardápio:</p>
            <div id="grid-mesas" class="grid grid-cols-5 gap-2.5 max-h-72 overflow-y-auto mb-4 p-1">
                <!-- Preenchido via JS -->
            </div>
        </div>
    </div>

    <div id="app" class="max-w-md mx-auto p-4">
        <!-- Cabeçalho -->
        <header class="bg-gradient-to-r from-red-600 to-red-700 p-4 rounded-2xl shadow-lg mb-4 text-white flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black tracking-wide">B.B CHURRASCO</h1>
                <p id="mesa-display" class="text-xs text-red-100 mt-0.5">Mesa -- • Cardápio Digital</p>
            </div>
            <button onclick="mudarMesa()" class="bg-black/20 hover:bg-black/40 text-xs px-3 py-1.5 rounded-xl font-bold backdrop-blur-md">Trocar Mesa</button>
        </header>

        <!-- Identificação do Cliente -->
        <div class="mb-4">
            <input type="text" id="nome-cliente" placeholder="Seu Nome / Apelido" class="w-full bg-zinc-900 border border-white/10 rounded-xl p-3 text-white placeholder-gray-500 focus:outline-none focus:border-red-500 text-sm">
        </div>

        <!-- Categorias Estilizadas (Abas Horizontais) -->
        <div id="categorias-container" class="flex gap-2 overflow-x-auto pb-3 mb-2 cats scrollbar-none">
            <!-- Preenchido via JS -->
        </div>

        <!-- Lista de Produtos da Categoria Atual -->
        <div id="produtos-container" class="space-y-3">
            <!-- Preenchido via JS -->
        </div>
    </div>

    <!-- Barra Inferior do Carrinho -->
    <div id="carrinho-bar" class="fixed bottom-0 left-0 right-0 bg-zinc-950/95 border-t border-white/10 p-4 backdrop-blur-md max-w-md mx-auto hidden z-40">
        <div class="flex justify-between items-center mb-3">
            <span class="text-xs text-gray-400"><span id="total-itens">0</span> itens selecionados</span>
            <span id="total-valor" class="text-base font-black text-white">R$ 0,00</span>
        </div>
        <button onclick="abrirResumo()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-red-600/20 text-sm">Ver Pedido e Enviar</button>
    </div>

    <!-- Modal de Resumo -->
    <div id="modal-resumo" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-zinc-900 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 border border-white/10">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modal-titulo" class="text-base font-black">Confirme seu Pedido</h2>
                <button onclick="fecharResumo()" class="text-gray-400 text-xl font-bold">&times;</button>
            </div>
            <p class="text-xs text-gray-400 mb-3">Após enviar, o pedido vai direto para a comanda da mesa. Para alterar depois, solicite ao garçom.</p>
            <div id="lista-carrinho" class="space-y-2 max-h-60 overflow-y-auto mb-4 text-sm"></div>
            <div class="border-t border-white/10 pt-3 flex justify-between font-bold text-base mb-4">
                <span>Total</span>
                <span id="modal-total">R$ 0,00</span>
            </div>
            <button onclick="enviarPedidoFirebase()" class="w-full bg-red-600 text-white font-bold py-3.5 rounded-xl mb-2 text-sm shadow-lg shadow-red-600/20">🚀 Enviar Pedido para a Cozinha</button>
            <button onclick="fecharResumo()" class="w-full bg-zinc-800 text-gray-300 font-bold py-3 rounded-xl text-sm">Continuar escolhendo</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBP_3bvi9PnViCPkIQqEdoF1I7BcItfHEY",
            authDomain: "bbchurrasco-app.firebaseapp.com",
            projectId: "bbchurrasco-app",
            storageBucket: "bbchurrasco-app.firebasestorage.app",
            messagingSenderId: "470656170967",
            appId: "1:470656170967:web:f9c96614d411561ddfe992",
            measurementId: "G-C0KJ5GJKG2"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Cardápio completo extraído do sistema do garçom
        const cardapio = {
            "CHURRASCOS": [
                ["Frango", 8, "Suculento espeto de frango"],
                ["Porco", 8, "Espeto suíno temperado"],
                ["Linguiça", 8, "Linguiça artesanal na brasa"],
                ["Coração de frango", 8, "Corações selecionados"],
                ["Coração de boi", 8, "Coração bovino grelhado"],
                ["Carne", 8, "Espeto de carne bovina"],
                ["Tripa", 8, "Tripa crocante na brasa"]
            ],
            "CARANGUEJO": [
                ["Caranguejo Unidade", 8, "Unidade fresca ao leite de coco"],
                ["Combo 4 Caranguejos", 28, "Combo promocional com 4 unidades"],
                ["Caldo de Caranguejo", 5, "Caldo quentinho e temperado"]
            ],
            "BEBIDAS": [
                ["Skol", 5, "Lata 350ml"],
                ["Brahma Chopp", 5, "Lata 350ml"],
                ["Brahma Puro Malte", 5, "Lata 350ml"],
                ["Império", 9, "Lata 350ml"],
                ["Heineken", 9, "Lata Long Neck / 350ml"],
                ["Corona Extra", 10, "Long Neck"],
                ["Budweiser", 8, "Lata / Long Neck"],
                ["Vinho", 8, "Taça / Dose de vinho"],
                ["Caipirinha", 15, "Cachaça, limão e açúcar"],
                ["Energético Red bull", 12, "Lata 250ml"],
                ["Kit gin", 80, "Gin rock’s / energético Baly / Gelo"],
                ["Stella gold", 11, "Long Neck"],
                ["Ice cabaré", 9, "Bebida mista"],
                ["Balde Skol", 50, "Balde com várias unidades"],
                ["Balde Brahma", 50, "Balde com várias unidades"],
                ["Terça amarela", 7, "Cerveja lata"],
                ["Terça prata", 6, "Cerveja lata"],
                ["Meio litro amarela", 16, "Garrafa 600ml"],
                ["Meio litro prata", 15, "Garrafa 600ml"],
                ["Litro da amarela", 35, "Litro gelado"],
                ["Litro da prata", 30, "Litro gelado"]
            ],
            "GUARNIÇÕES": [
                ["Baião caseiro grande", 8, "Porção grande tradicional"],
                ["Baião caseiro pequeno", 4, "Porção individual"],
                ["Baião cremoso grande", 10, "Com queijo coalho e requeijão"],
                ["Baião cremoso pequeno", 5, "Individual cremoso"],
                ["Feijão verde", 25, "Combo especial"],
                ["Panelada", 18, "Acompanha arroz / farofa de cuscuz"]
            ],
            "PETISCOS": [
                ["Batata frita", 15, "Porção crocante"],
                ["Calabresa acebolada", 15, "Com cebolas douradas"],
                ["Camarão (porção)", 25, "Camarões selecionados"],
                ["Bolinha carne do sol", 18, "Porção recheada"],
                ["Bolinha de queijo", 15, "Crocante e derretida"]
            ],
            "REFRIGERANTES": [
                ["Coca-Cola 1L", 8, "Garrafa 1 Litro"],
                ["Guaraná 1L", 7, "Garrafa 1 Litro"],
                ["Pepsi 1L", 7, "Garrafa 1 Litro"],
                ["Coca-Cola lata", 5, "Lata 350ml"],
                ["Fanta lata", 5, "Lata 350ml"],
                ["Sprite lata", 6, "Lata 350ml"],
                ["Água", 3, "Garrafa 500ml sem gás"],
                ["Água com gás", 4, "Garrafa 500ml com gás"]
            ],
            "SUCOS": [
                ["Suco Maracujá 400ml", 8, "Fruta natural da polpa"],
                ["Suco Manga 400ml", 7, "Refrescante e cremoso"],
                ["Suco Goiaba 400ml", 7, "Sabor natural"]
            ],
            "DIVERSOS": [
                ["Cigarro", 7, "Carteira"],
                ["Partilha halls", 3, "Unidade de pastilha"]
            ]
        };

        let mesaAtual = null;
        let categoriaAtiva = "CHURRASCOS";
        let carrinho = []; // Armazena { nome, preco, qtd }

        // Inicialização das 30 mesas
        function iniciarGridMesas() {
            const grid = document.getElementById('grid-mesas');
            grid.innerHTML = '';
            for (let i = 1; i <= 30; i++) {
                grid.innerHTML += `<button onclick="selecionarMesa(${i})" class="bg-zinc-800 hover:bg-red-600 text-white font-bold py-3 rounded-xl text-sm border border-white/5 transition-colors">${i}</button>`;
            }
        }

        function verificarMesaInicial() {
            const urlParams = new URLSearchParams(window.location.search);
            const mesaUrl = urlParams.get('mesa');
            if (mesaUrl && mesaUrl >= 1 && mesaUrl <= 30) {
                selecionarMesa(mesaUrl);
            } else {
                iniciarGridMesas();
            }
        }

        function selecionarMesa(num) {
            mesaAtual = num;
            document.getElementById('mesa-display').innerText = `Mesa ${mesaAtual} • Cardápio Digital`;
            document.getElementById('modal-mesa').classList.add('hidden');
        }

        function mudarMesa() {
            document.getElementById('modal-mesa').classList.remove('hidden');
            iniciarGridMesas();
        }

        function renderizarCategorias() {
            const container = document.getElementById('categorias-container');
            container.innerHTML = Object.keys(cardapio).map(cat => `
                <button onclick="mudarCategoria('${cat}')" class="whitespace-nowrap px-4 py-2 rounded-xl font-bold text-xs border transition-all ${cat === categoriaAtiva ? 'bg-red-600 text-white border-red-600 shadow-lg shadow-red-600/20' : 'bg-zinc-900/60 text-gray-400 border-white/10 hover:border-white/20'}">${cat}</button>
            `).join('');
        }

        function mudarCategoria(cat) {
            categoriaAtiva = cat;
            renderizarCategorias();
            renderizarProdutos();
        }

        function renderizarProdutos() {
            const container = document.getElementById('produtos-container');
            const itens = cardapio[categoriaAtiva] || [];

            container.innerHTML = itens.map(([nome, preco, desc]) => {
                const itemCarrinho = carrinho.find(i => i.nome === nome);
                const qtd = itemCarrinho ? itemCarrinho.qtd : 0;

                return `
                    <div class="bg-zinc-900/60 border border-white/10 p-4 rounded-2xl flex justify-between items-center">
                        <div class="pr-2">
                            <h3 class="font-bold text-white text-sm">${nome}</h3>
                            <p class="text-xs text-gray-400 mt-0.5">${desc}</p>
                            <span class="text-red-400 font-bold text-sm mt-1.5 block">R$ ${preco.toFixed(2).replace('.', ',')}</span>
                        </div>
                        <div class="flex items-center gap-2 bg-black/40 p-1 rounded-xl border border-white/5 shrink-0">
                            <button onclick="alterarQtd('${nome.replace(/'/g, "\\'")}', ${preco}, -1)" class="w-8 h-8 rounded-lg bg-zinc-800 text-white font-bold flex items-center justify-center active:scale-90 transition-transform">-</button>
                            <span id="qtd-${nome}" class="w-6 text-center font-bold text-sm text-white">${qtd}</span>
                            <button onclick="alterarQtd('${nome.replace(/'/g, "\\'")}', ${preco}, 1)" class="w-8 h-8 rounded-lg bg-red-600 text-white font-bold flex items-center justify-center active:scale-90 transition-transform">+</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function alterarQtd(nome, preco, delta) {
            let item = carrinho.find(i => i.nome === nome);
            if (item) {
                item.qtd += delta;
                if (item.qtd <= 0) {
                    carrinho = carrinho.filter(i => i.nome !== nome);
                }
            } else if (delta > 0) {
                carrinho.push({ nome, preco, qtd: delta });
            }

            // Atualiza o número na tela sem perder o foco
            const elemQtd = document.getElementById(`qtd-${nome}`);
            if (elemQtd) {
                const atualizado = carrinho.find(i => i.nome === nome);
                elemQtd.innerText = atualizado ? atualizado.qtd : 0;
            }

            atualizarBarraCarrinho();
        }

        function atualizarBarraCarrinho() {
            const totalQtd = carrinho.reduce((sum, i) => sum + i.qtd, 0);
            const totalVal = carrinho.reduce((sum, i) => sum + (i.preco * i.qtd), 0);

            document.getElementById('total-itens').innerText = totalQtd;
            document.getElementById('total-valor').innerText = `R$ ${totalVal.toFixed(2).replace('.', ',')}`;

            const bar = document.getElementById('carrinho-bar');
            if (totalQtd > 0) {
                bar.classList.remove('hidden');
            } else {
                bar.classList.add('hidden');
            }
        }

        function abrirResumo() {
            const lista = document.getElementById('lista-carrinho');
            lista.innerHTML = '';
            let total = 0;

            carrinho.forEach(item => {
                const sub = item.preco * item.qtd;
                total += sub;
                lista.innerHTML += `
                    <div class="flex justify-between items-center py-1.5 border-b border-white/5 text-sm">
                        <span>${item.qtd}x ${item.nome}</span>
                        <span class="font-bold text-white">R$ ${sub.toFixed(2).replace('.', ',')}</span>
                    </div>
                `;
            });

            document.getElementById('modal-titulo').innerText = `Mesa ${mesaAtual} — Seu Pedido`;
            document.getElementById('modal-total').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
            document.getElementById('modal-resumo').classList.remove('hidden');
        }

        function fecharResumo() {
            document.getElementById('modal-resumo').classList.add('hidden');
        }

        async function enviarPedidoFirebase() {
            const cliente = document.getElementById('nome-cliente').value.trim() || "Cliente Anônimo";
            if (!carrinho.length || !mesaAtual) return;

            try {
                // Busca a comanda atual da mesa no Firebase para somar os novos itens corretamente
                const comandaRef = db.collection('comandas').doc(String(mesaAtual));
                const doc = await comandaRef.get();
                
                let itensExistentes = [];
                let totalExistente = 0;
                let garcomAtual = "Hebster";
                let criadoEmOriginal = Date.now();

                if (doc.exists) {
                    const dados = doc.data();
                    itensExistentes = dados.itens || [];
                    totalExistente = dados.total || 0;
                    garcomAtual = dados.garcom || "Hebster";
                    criadoEmOriginal = dados.criadoEm || Date.now();
                }

                // Prepara os novos itens com o nome do cliente que fez o pedido
                const novosItensFormatados = carrinho.map(i => ({
                    cliente: cliente,
                    nome: i.nome,
                    qtd: i.qtd,
                    preco: i.preco
                }));

                const itensCombinados = [...itensExistentes, ...novosItensFormatados];
                const valorAdicional = carrinho.reduce((sum, i) => sum + (i.preco * i.qtd), 0);
                const novoTotal = totalExistente + valorAdicional;

                // Salva atualizado na coleção 'comandas' do Firebase
                await comandaRef.set({
                    garcom: garcomAtual,
                    itens: itensCombinados,
                    total: novoTotal,
                    criadoEm: criadoEmOriginal,
                    atualizadoEm: Date.now()
                }, { merge: true });

                alert('Pedido enviado com sucesso para a comanda da mesa!');
                
                // Limpa o carrinho do cliente
                carrinho = [];
                renderizarProdutos();
                atualizarBarraCarrinho();
                fecharResumo();
            } catch (error) {
                alert('Erro ao enviar pedido: ' + error.message);
            }
        }

        // Inicialização
        verificarMesaInicial();
        renderizarCategorias();
        renderizarProdutos();
    </script>
</body>
</html>
